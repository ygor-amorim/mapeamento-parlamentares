name: Atualizar dados

on:
  schedule:
    - cron: "17 6 1 * *"   # dia 1 de cada mês, 06:17 UTC
  workflow_dispatch:        # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar o pipeline
        run: python -m pipeline.build
      - name: Commitar se os dados mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/parlamentares.csv data/frentes_camara.csv; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: atualização automática $(date -u +%Y-%m-%d)"
            git push
          fi
